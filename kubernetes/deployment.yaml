kind: Deployment
apiVersion: apps/v1
metadata:
  name: java-maven-app
  labels:
    app: java-maven-app
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: java-maven-app
  template:
    metadata:
      labels: 
        app: java-maven-app
    spec:
      containers:
        - name: java-maven-app
          image: surajrbabar/java-maven-app:java-maven-$IMAGE_NAME
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
